name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Run the test suite
        # The GUI tests need a display. xvfb provides one on Linux; on Windows and macOS the
        # runners have a window server already, and Qt runs offscreen either way.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
        if: runner.os != 'Linux'

      - name: Run the test suite (Linux, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a pytest -q
        if: runner.os == 'Linux'

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build, warnings as errors
        # Read the Docs runs sphinx from inside docs/. Reproduce that exactly: a build from
        # the repository root resolves conf.py's sys.path differently and can pass while
        # Read the Docs fails.
        working-directory: docs
        run: python -m sphinx -T -j auto -W -b html -d _build/doctrees . _build/html
